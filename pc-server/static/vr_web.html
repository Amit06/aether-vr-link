<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>AETHER-VR // Stereoscopic SBS Headset View</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: #020409;
      color: #F8FAFC;
      font-family: 'Segoe UI', system-ui, sans-serif;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      display: flex;
    }
    .eye-viewport {
      width: 50vw;
      height: 100vh;
      position: relative;
      overflow: hidden;
      border-right: 1px solid rgba(255, 255, 255, 0.06);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #000000;
    }
    .screen-frame {
      width: 96%;
      aspect-ratio: 16 / 9;
      border-radius: 6px;
      overflow: hidden;
      position: relative;
      background: #000000;
    }
    .screen-frame img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }
  </style>
</head>
<body>
  <div class="eye-viewport" id="left-eye">
    <div class="screen-frame" id="frame-l"><img id="img-l" alt="Left VR Feed" /></div>
  </div>
  <div class="eye-viewport" id="right-eye">
    <div class="screen-frame" id="frame-r"><img id="img-r" alt="Right VR Feed" /></div>
  </div>

  <script>
    const proto = location.protocol === 'https:' ? 'wss' : 'ws';
    const wsStream = new WebSocket(`${proto}://${location.host}/ws/stream`);
    wsStream.binaryType = 'blob';
    let prevUrl = null;
    wsStream.onmessage = (ev) => {
      const url = URL.createObjectURL(ev.data);
      document.getElementById('img-l').src = url;
      document.getElementById('img-r').src = url;
      if (prevUrl) URL.revokeObjectURL(prevUrl);
      prevUrl = url;
    };

    const wsVr = new WebSocket(`${proto}://${location.host}/ws/vr`);
    window.addEventListener('deviceorientation', (e) => {
      if (wsVr.readyState === WebSocket.OPEN && e.alpha !== null) {
        wsVr.send(JSON.stringify({
          type: 'imu',
          yaw: -e.alpha,
          pitch: e.beta || 0,
          roll: e.gamma || 0,
          device: 'WebVR Fallback Client'
        }));
      }
    });

    wsVr.onmessage = (ev) => {
      const d = JSON.parse(ev.data);
      if (d.type === 'telemetry' && d.dist) {
        // Scale screen size smoothly based on Virtual Screen Distance slider (0.8m..4.0m)
        const pct = Math.max(45, Math.min(98, Math.round(145 / d.dist)));
        document.getElementById('frame-l').style.width = `${pct}%`;
        document.getElementById('frame-r').style.width = `${pct}%`;
      }
    };

    document.body.addEventListener('click', () => {
      if (wsVr.readyState === WebSocket.OPEN) {
        wsVr.send(JSON.stringify({ type: 'recenter' }));
      }
      if (document.documentElement.requestFullscreen) {
        document.documentElement.requestFullscreen().catch(() => {});
      }
    });
  </script>
</body>
</html>
